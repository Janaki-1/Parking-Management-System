<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SmartPark — Find Parking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">SmartPark</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="find.html">Find Parking</a></li>
          <li class="nav-item"><a class="nav-link" href="account.html">Account</a></li>
          <li class="nav-item ms-2" id="nav-auth">
            <a class="btn btn-outline-light me-2" href="login.html">Login</a>
            <a class="btn btn-primary" href="signup.html">Sign Up</a>
          </li>
          <li class="nav-item ms-2 d-none" id="nav-logged">
            <span class="navbar-text text-light me-3" id="welcomeUser">Hello</span>
            <button class="btn btn-outline-danger" id="btn-logout">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h2>Find Parking</h2>
    <p class="text-muted">Start typing city / district / landmark in Kerala — suggestions will appear.</p>

    <div class="row g-3 align-items-center">
      <div class="col-md-8 position-relative">
        <input id="searchInput" autocomplete="off" class="form-control form-control-lg" placeholder="e.g., Kochi, Alappuzha, Marine Drive">
        <div id="suggestBox" class="list-group suggestion-box d-none"></div>
      </div>
      <div class="col-md-4 d-grid">
        <button id="searchBtn" class="btn btn-primary btn-lg">Search Parking</button>
      </div>
    </div>

    <hr class="my-4">
    <div id="resultsMessage" class="mb-3"></div>
    <div id="resultsGrid" class="row g-4"></div>
    <div id="relatedBox" class="mt-4 text-muted"></div>
  </main>

  <!-- Payment modal (used for paid bookings) -->
  <div class="modal fade" id="modalPayment" tabindex="-1">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Payment</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="paymentAlert" class="alert alert-danger d-none"></div>

          <form id="paymentForm" autocomplete="off">
            <div class="mb-3">
              <label class="form-label">Payment method</label>
              <div class="d-flex gap-2">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="payMethod" id="payCard" value="card" checked>
                  <label class="form-check-label" for="payCard">Card</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="payMethod" id="payGpay" value="gpay">
                  <label class="form-check-label" for="payGpay">GPay</label>
                </div>
              </div>
            </div>

            <div id="cardFields">
              <div class="mb-3">
                <label class="form-label">Name on card</label>
                <input id="cardName" class="form-control" placeholder="Full name as on card">
              </div>
              <div class="mb-3">
                <label class="form-label">Card number</label>
                <input id="cardNumber" class="form-control" placeholder="xxxx xxxx xxxx xxxx" maxlength="19">
              </div>
              <div class="row g-2">
                <div class="col">
                  <label class="form-label">Expiry (MM/YY)</label>
                  <input id="cardExp" class="form-control" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="col">
                  <label class="form-label">CVV</label>
                  <input id="cardCvv" class="form-control" placeholder="123" maxlength="4">
                </div>
              </div>
            </div>

            <div id="gpayInfo" class="d-none">
              <p class="small text-muted">You chose GPay. Click pay to simulate GPay transaction.</p>
              <div class="mb-3">
                <label class="form-label">GPay mobile (for simulation)</label>
                <input id="gpayNumber" class="form-control" placeholder="+91xxxxxxxxxx">
              </div>
            </div>

            <div class="mt-3 text-end">
              <button type="submit" class="btn btn-success" id="payNowBtn">Pay ₹0</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <!-- Ticket modal -->
  <div class="modal fade" id="modalTicket" tabindex="-1">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Booking Confirmed</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="ticketBody"></div>
        <div class="modal-footer">
          <button id="btnDownloadTicket" class="btn btn-primary">Download Ticket</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3">
    <div class="container">© SmartPark • Demo app</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
